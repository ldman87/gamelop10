    <title>Thông tin Học sinh tham gia LMS - 11A7</title>
    <meta name="description" content="Hệ thống thu thập thông tin học sinh" />

    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set) {
              var orig = window.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return orig; },
                set: function(val) { orig = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
