    <meta charset="UTF-8" />

    <title>Thông tin Học sinh tham gia LMS - 11A7</title>
    <meta name="description" content="Thông tin Học sinh tham gia LMS - 11A7." />
    <meta property="og:title" content="Thông tin Học sinh tham gia LMS - 11A7" />
    <meta property="og:description" content="Thông tin Học sinh tham gia LMS - 11A7." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <script>
      // 1. Guard against third-party extension injection conflicts & dev WebSocket notices
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message) : '';
        var filename = (event && event.filename) ? String(event.filename) : '';
        if (
          msg.indexOf('ethereum') !== -1 ||
          msg.indexOf('evmAsk') !== -1 ||
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('M_ID') !== -1 ||
          msg.indexOf('Cannot set property fetch') !== -1 ||
          filename.indexOf('200.js') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) ? String(reason.message) : (typeof reason === 'string' ? reason : '');
        var stack = (reason && reason.stack) ? String(reason.stack) : '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('M_ID') !== -1 ||
          stack.indexOf('200.js') !== -1 ||
          stack.indexOf('M_ID') !== -1
        ) {
          event.preventDefault();
        }
      });

      // 2. Pre-define window.ethereum with a configurable getter/setter so extensions won't throw 'Cannot redefine property'
      try {
        if (!('ethereum' in window)) {
          var _eth = undefined;
          Object.defineProperty(window, 'ethereum', {
            get: function() { return _eth; },
            set: function(val) { _eth = val; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}

      // 3. Ensure window.fetch is writable and has a setter
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set) {
              var orig = window.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return orig; },
                set: function(val) { orig = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
